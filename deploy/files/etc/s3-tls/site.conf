# S3 clients sign every request, with an Authorization header or, for
# presigned URLs, in the query string; browsers never do. Signed requests
# go to versitygw, and the rest to the portal. A presigned POST (an HTML
# form upload, as `mc share upload` makes) carries its signature in the
# form body, so multipart form posts go to versitygw too: the portal never
# takes them.
#
# The maps below find the gateway by its port, :7070. If it listens
# elsewhere, change every ":7070" here.
map "$http_authorization $args $request_method $content_type" $s3_upstream {
    default http://10.89.40.11:8080;
    "~^AWS" http://10.89.40.10:7070;
    "~*(^| |&)(x-amz-signature|signature)=" http://10.89.40.10:7070;
    "~ POST multipart/form-data(;|$)" http://10.89.40.10:7070;
}

# versitygw serves objects with whatever Content-Type their uploader set,
# on the portal's origin: an uploaded HTML page opened from a presigned
# link would run as the portal. These sandbox its responses (no scripts,
# an opaque origin); downloads and images still work. An empty value adds
# no header, so the portal's own responses are untouched.
map $s3_upstream $s3_object_csp {
    default "";
    "~:7070$" "sandbox; default-src 'none'";
}
map $s3_upstream $s3_object_nosniff {
    default "";
    "~:7070$" "nosniff";
}

# Keys can't create buckets (the portal makes them, each its own dataset),
# but rclone sends CreateBucket before its first upload and accepts only
# BucketAlreadyOwnedByYou, so without no_check_bucket every upload fails
# with AccessDenied. A signed CreateBucket is a PUT to the gateway of
# /<bucket> with no query string: subresources (?policy, ?acl) carry one,
# and so do presigned URLs. Those are answered below: BucketAlreadyOwnedByYou
# if the bucket exists, and otherwise a refusal that says to make it in the
# portal. The name pattern is S3's, so replies only ever echo a plain
# bucket name. The two spaces are the empty $args.
map "$request_method $s3_upstream $args $uri" $s3_create_bucket {
    default 0;
    "~^PUT \S+:7070  /[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]/?$" 1;
}

# versitygw refuses an upload it won't take (no access, an add-only key
# without If-None-Match, an object that exists) before reading the body,
# then closes the connection with the body unread. nginx, still sending,
# gets a reset and loses the refusal, and would answer with its own HTML
# 502, which clients retry. An upload whose body was partly sent and then
# cut off is answered as refused instead.
map "$request_method $upstream_bytes_sent" $s3_body_refused {
    default 0;
    "~^(PUT|POST) [1-9]" 1;
}
map $s3_upstream $s3_is_gateway {
    default 0;
    "~:7070$" 1;
}

server {
    listen 80 default_server;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    # /etc/s3-tls/tls/ on the host: the full chain, and its key (root, 0600).
    ssl_certificate /etc/nginx/site/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/site/tls/privkey.pem;

    # Stream uploads and downloads of any size straight through.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        # For the reply below; proxied responses keep their own type.
        default_type application/xml;
        if ($s3_create_bucket) {
            rewrite ^ /.s3-create-bucket last;
        }
        proxy_pass $s3_upstream;
        error_page 502 = @upstream_failed;
        add_header Content-Security-Policy $s3_object_csp always;
        add_header X-Content-Type-Options $s3_object_nosniff always;
        proxy_http_version 1.1;
        # As the client sent it: it's part of the S3 signature.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # A signed CreateBucket: ask the gateway, anonymously, whether the
    # bucket exists (403 if it does, 404 if not) and answer for it. An
    # anonymous HEAD already says as much to anyone, so nothing leaks.
    location = /.s3-create-bucket {
        internal;
        proxy_method HEAD;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "";
        proxy_set_header Host $http_host;
        proxy_intercept_errors on;
        error_page 403 = @s3_bucket_exists;
        error_page 404 = @s3_bucket_missing;
        proxy_pass http://10.89.40.10:7070$request_uri;
    }
    location @s3_bucket_exists {
        default_type application/xml;
        return 409 '<?xml version="1.0" encoding="UTF-8"?>\n<Error><Code>BucketAlreadyOwnedByYou</Code><Message>Buckets are made in the portal; this one is yours to use if your key has access to it.</Message><Resource>$request_uri</Resource><RequestId>$request_id</RequestId></Error>\n';
    }
    location @s3_bucket_missing {
        default_type application/xml;
        return 403 '<?xml version="1.0" encoding="UTF-8"?>\n<Error><Code>AccessDenied</Code><Message>There is no such bucket, and keys can\'t create buckets: make it in the portal.</Message><Resource>$request_uri</Resource><RequestId>$request_id</RequestId></Error>\n';
    }

    # A 502 from either upstream. For the gateway, an upload cut off part
    # way was refused (see $s3_body_refused); anything else means it's
    # down. Both are answered in S3's XML, so clients report them sensibly.
    location @upstream_failed {
        # The portal: nginx's own error page, for a browser.
        if ($s3_is_gateway = 0) {
            return 502;
        }
        default_type application/xml;
        if ($s3_body_refused) {
            return 403 '<?xml version="1.0" encoding="UTF-8"?>\n<Error><Code>AccessDenied</Code><Message>The gateway refused this upload: the key can\'t write here, an add-only key sent no If-None-Match: * or used multipart, or the file already exists.</Message><Resource>$uri</Resource><RequestId>$request_id</RequestId></Error>\n';
        }
        return 503 '<?xml version="1.0" encoding="UTF-8"?>\n<Error><Code>ServiceUnavailable</Code><Message>The S3 gateway isn\'t answering. Try again shortly.</Message><RequestId>$request_id</RequestId></Error>\n';
    }
}
