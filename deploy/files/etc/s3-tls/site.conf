# S3 clients sign every request, with an Authorization header or, for
# presigned URLs, in the query string; browsers never do. Signed requests
# go to versitygw, and the rest to the portal.
map "$http_authorization $args" $s3_upstream {
    default http://10.89.40.11:8080;
    "~^AWS" http://10.89.40.10:7070;
    "~*(^| |&)(x-amz-signature|signature)=" http://10.89.40.10:7070;
}

# versitygw serves objects with whatever Content-Type their uploader set,
# on the portal's origin: an uploaded HTML page opened from a presigned
# link would run as the portal. These sandbox its responses (no scripts,
# an opaque origin); downloads and images still work. An empty value adds
# no header, so the portal's own responses are untouched.
map $s3_upstream $s3_object_csp {
    default "";
    "~:7070$" "sandbox; default-src 'none'";
}
map $s3_upstream $s3_object_nosniff {
    default "";
    "~:7070$" "nosniff";
}

# Keys can't create buckets (the portal makes them, each its own dataset),
# but rclone sends CreateBucket before its first upload and accepts only
# BucketAlreadyOwnedByYou, so without no_check_bucket every upload fails
# with AccessDenied. A signed CreateBucket is a PUT to the gateway of
# /<bucket> with no query string: subresources (?policy, ?acl) carry one,
# and so do presigned URLs. Those are answered below with
# BucketAlreadyOwnedByYou, whether or not the bucket exists; if it doesn't,
# the client's next request fails with NoSuchBucket. The name pattern is
# S3's, so the reply only ever echoes a plain bucket name. The two spaces
# are the empty $args.
map "$request_method $s3_upstream $args $uri" $s3_create_bucket {
    default 0;
    "~^PUT \S+:7070  /[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]/?$" 1;
}

server {
    listen 80 default_server;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    # /etc/s3-tls/tls/ on the host: the full chain, and its key (root, 0600).
    ssl_certificate /etc/nginx/site/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/site/tls/privkey.pem;

    # Stream uploads and downloads of any size straight through.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        # For the reply below; proxied responses keep their own type.
        default_type application/xml;
        if ($s3_create_bucket) {
            return 409 '<?xml version="1.0" encoding="UTF-8"?>\n<Error><Code>BucketAlreadyOwnedByYou</Code><Message>Buckets are made in the portal; this one is yours to use if your key has access to it.</Message><Resource>$uri</Resource><RequestId>$request_id</RequestId></Error>\n';
        }
        proxy_pass $s3_upstream;
        add_header Content-Security-Policy $s3_object_csp always;
        add_header X-Content-Type-Options $s3_object_nosniff always;
        proxy_http_version 1.1;
        # As the client sent it: it's part of the S3 signature.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
