user www-data;
worker_processes auto;
pid /run/nginx.pid;
# In the foreground, as the container's process.
daemon off;

# To the container's output, which the journal keeps under its unit.
error_log stderr error;

events {
    worker_connections 768;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Content types for the files nginx serves itself: browsers refuse
    # stylesheets and scripts that come back as anything else.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
  
    # Mozilla Modern TLS configuration:
    # https://mozilla.github.io/server-side-tls/ssl-config-generator/
    ssl_session_timeout 1d;
    # This causes problems when doing split horizon
    # ssl_session_cache shared:SSL:50m;
    # ssl_session_tickets off;
    
    ssl_session_tickets off;   # no TLS session tickets
    ssl_session_cache   off;   # no session-ID cache; tells clients not to reuse sessions

    # Mozilla's "intermediate" profile.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;


    access_log /dev/stdout combined;
    
    # Enable gzip
    gzip on;
    gzip_disable "msie6";
    
    # This instance's site.
    include /etc/nginx/site/site.conf;
}
